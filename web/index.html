<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>NombrePendiente | Loading</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0c1324",
                        "on-surface": "#dce1fb",
                        "primary": "#4edea3",
                        "primary-container": "#10b981",
                        "secondary-container": "#3c4a5e",
                        "navy-border": "#1E293B",
                        "emerald-glow": "#34D399",
                        "on-primary": "#003824",
                        "on-primary-container": "#00422b",
                        "on-surface-variant": "#bbcabf"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "base": "4px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "label-caps": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "headline-xl": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
    <style>
        @view-transition {
            navigation: auto;
        }

        @keyframes subtle-pulse {

            0%,
            100% {
                opacity: 0.8;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        @keyframes progress-slide {
            0% {
                transform: translateX(-100%);
            }

            50% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .animate-logo {
            animation: subtle-pulse 3s ease-in-out infinite;
        }

        .loading-bar-inner {
            animation: progress-slide 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        .glass-blur {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>

<body
    class="bg-surface dark:bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
    <main class="relative h-screen w-full flex flex-col items-center justify-center overflow-hidden">
        <!-- Ambient Atmospheric Background -->
        <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
            <div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary/5 blur-[120px]"></div>
            <div
                class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary-container/10 blur-[100px]">
            </div>
        </div>
        <!-- Central Branding Container -->
        <div class="relative z-10 flex flex-col items-center gap-stack-lg animate-logo">
            <!-- NombrePendiente Logo Cluster -->
            <div class="flex items-center gap-base">
                <div
                    class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center shadow-[0px_0px_20px_rgba(78,222,163,0.3)]">
                    <span class="material-symbols-outlined text-on-primary text-[28px]"
                        style="font-variation-settings: 'FILL' 1;">
                        account_balance
                    </span>
                </div>
                <h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">
                    NombrePendiente
                </h1>
            </div>
            <!-- Loading Indicator -->
            <div class="flex flex-col items-center gap-stack-sm w-48">
                <!-- Track -->
                <div class="h-[2px] w-full bg-navy-border overflow-hidden rounded-full relative">
                    <!-- Progress Element -->
                    <div
                        class="loading-bar-inner absolute top-0 left-0 h-full w-1/2 bg-emerald-glow shadow-[0px_0px_8px_rgba(52,211,153,0.6)]">
                    </div>
                </div>
                <!-- Status Text -->
                <span
                    class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest opacity-60">
                    Securing Connection
                </span>
            </div>
        </div>
        <!-- Subtle Footer Branding (Optional/Contextual) -->
        <div class="absolute bottom-12 flex flex-col items-center opacity-40">
            <div class="flex items-center gap-2 mb-2">
                <span class="material-symbols-outlined text-[16px]">verified_user</span>
                <span class="font-body-sm text-body-sm">Enterprise Grade Encryption</span>
            </div>
        </div>
    </main>
    <!-- Micro-interaction Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusText = document.querySelector('.text-label-caps');
            const messages = [
                "Securing Connection",
                "Loading Portfolio",
                "Syncing Accounts",
                "Optimizing View"
            ];
            let index = 0;

            // Simple text rotation for the loading state
            setInterval(() => {
                index = (index + 1) % messages.length;
                statusText.style.opacity = '0';
                setTimeout(() => {
                    statusText.textContent = messages[index];
                    statusText.style.opacity = '0.6';
                }, 400);
            }, 3000);
        });
    </script>
</body>

</html>
<script src="js/funciones.js"></script>

<script src="js/index.js"></script>
