<!DOCTYPE html>

<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Gestionar Cuentas - FlujoCaja App</title>
  <!-- BEGIN: External Scripts -->
  <script src="../vendor/tailwind.js"></script>
  <!-- END: External Scripts -->
  <!-- BEGIN: Custom Configurations -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#10b77f', // Custom Emerald Green from THEME_12
            dark: {
              900: '#0f172a',
              800: '#1e293b',
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          borderRadius: {
            'xl': '8px',
            'lg': '8px',
          }
        }
      }
    }
  </script>
  <!-- END: Custom Configurations -->
  <!-- BEGIN: Page Styles -->
  <style data-purpose="layout-styling">
    @view-transition {
      navigation: auto;
    }

    .account-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .account-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .account-card:hover {
      transform: translateY(-4px);
    }

    body {
      font-family: 'Inter', sans-serif;
      animation: page-fade-in .18s ease-out;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <link rel="stylesheet" href="../css/fonts.css" />
  <!-- END: Page Styles -->
</head>

<body class="bg-dark-900 min-h-screen font-sans text-slate-200 flex overflow-hidden">
  <!-- BEGIN: Sidebar Navigation -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex border-r border-slate-800"  data-component="../components/sidemenu.html"  data-purpose="sidebar"> </aside>
  <!-- BEGIN: MainContentWrapper -->
  <div class="flex-1 flex flex-col h-screen overflow-y-auto">
    <!-- BEGIN: MainHeader -->
    <!-- END: MainHeader -->
    <!-- BEGIN: MainContent -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full" data-purpose="accounts-management-screen">
      <!-- BEGIN: SectionHeader -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl font-bold text-white">Gestionar Cuentas</h1>
          <p class="text-slate-400 text-sm mt-1">Rastree y organice sus fuentes financieras</p>
        </div>
        <!-- ADD NEW ACCOUNT BUTTON -->
        <button
          class="inline-flex items-center justify-center px-5 py-2.5 border border-transparent text-sm font-semibold rounded-lg shadow-sm text-dark-900 bg-primary hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors"
          data-purpose="add-account-trigger" id="btn-add-account">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
            <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
          Añadir Nueva Cuenta
        </button>
      </div>
      <!-- END: SectionHeader -->
      <!-- BEGIN: AccountGrid -->
      <div class="account-grid" id="accounts-container">
      </div>
      <!-- END: AccountGrid -->
      <!-- BEGIN: Footer -->

      <!-- END: Footer -->
    </main>
    <!-- END: MainContent -->
  </div>
  <!-- END: MainContentWrapper -->
  <!-- BEGIN: Modal Nueva Cuenta -->
  <div id="modalCuenta" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
    <div class="bg-dark-800 rounded-xl border border-slate-800 shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-bold text-white">Añadir Nueva Cuenta</h2>
        <button type="button" data-cerrar-modal class="text-slate-500 hover:text-slate-300 transition-colors text-xl">
          &times;
        </button>
      </div>
      <form id="formNuevaCuenta" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="inputNombreCuenta">Nombre</label>
          <input id="inputNombreCuenta" type="text"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 focus:ring-2 focus:ring-primary focus:border-primary"
            placeholder="Ej: Efectivo, Banco, Ahorros" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="inputDescripcionCuenta">Descripción
            (opcional)</label>
          <input id="inputDescripcionCuenta" type="text"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 focus:ring-2 focus:ring-primary focus:border-primary"
            placeholder="Descripción de la cuenta" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="inputTipoCuenta">Tipo de cuenta</label>
          <select id="inputTipoCuenta"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 focus:ring-2 focus:ring-primary focus:border-primary">
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="inputMoneda">Moneda</label>
          <select id="inputMoneda"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border border-slate-800 text-slate-200 focus:ring-2 focus:ring-primary focus:border-primary">
          </select>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" data-cerrar-modal
            class="flex-1 py-2.5 rounded-lg bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 transition-colors">
            Cancelar
          </button>
          <button type="button" id="btn-guardar-cuenta"
            class="flex-1 py-2.5 rounded-lg bg-primary text-dark-900 font-semibold hover:bg-emerald-400 transition-colors">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
  <!-- END: Modal Nueva Cuenta -->
  <script src="../js/funciones.js"></script>
  <script src="../js/notificaciones.js"></script>
  <script src="../js/cuentas.js"></script>
  <script src="../js/loadmenu.js"></script>
</body>

</html>
