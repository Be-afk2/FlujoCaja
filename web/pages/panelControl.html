<!DOCTYPE html>

<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>NombrePendiente - Panel de Finanzas Personales</title>
    <!-- Tailwind CSS CDN with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        },
                        slate: {
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    borderRadius: {
                        'lg': '0.5rem',
                        'xl': '0.75rem',
                        '2xl': '1rem',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style data-purpose="global-styles">
        @view-transition {
            navigation: auto;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            /* Slate 950 for dark mode background */
        }
    </style>
</head>

<body class="flex h-screen overflow-hidden text-slate-200">
    <!-- BEGIN: Sidebar Navigation -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex border-r border-slate-800"
        data-component="../components/sidemenu.html" data-purpose="sidebar"> </aside>
    <!-- END: Sidebar Navigation -->
    <!-- BEGIN: Main Content -->
    <main class="flex-1 overflow-y-auto bg-slate-950" data-purpose="main-dashboard-area">
        <!-- BEGIN: Header -->
        <!--
        <header
            class="bg-slate-900 border-b border-slate-800 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h1 class="text-2xl font-bold text-white">Resumen Financiero</h1>

                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path

                    </svg>
                </button>
                <a href="transacciones.html">
                    <button 
                        class="bg-emerald-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-emerald-600 transition-colors shadow-sm text-sm">
                        + Nueva Transacción
                    </button>
                </a>
            </div>
        </header>
        -->
        <!-- END: Header -->
        <div class="p-8 space-y-8">
            <!-- BEGIN: Key Metric Cards -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6" data-purpose="stat-cards">
                <!-- Total Balance Card -->
                <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm font-medium text-slate-400">Balance Total</span>
                        <div class="p-2 bg-blue-500/10 text-blue-400 rounded-lg">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V5a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="text-3xl font-bold text-white" id="saldoTotal">$0.00</div>
                    <div class="mt-2 text-sm text-emerald-500 font-medium flex items-center">
                        <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 10l7-7m0 0l7 7m-7-7v18" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"></path>
                        </svg>
                        <span id="saldoTotalSub">Suma de tus cuentas</span>
                    </div>
                </div>
                <!-- Monthly Income Card -->
                <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm font-medium text-slate-400">Ingresos Mensuales</span>
                        <div class="p-2 bg-emerald-500/10 text-emerald-500 rounded-lg">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 11l5-5m0 0l5 5m-5-5v12" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="text-3xl font-bold text-white" id="ingresosMes">$0.00</div>
                    <div class="mt-2 text-sm text-slate-500" id="ingresosMesSub">Mes actual</div>
                </div>
                <!-- Monthly Expenses Card -->
                <div class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm font-medium text-slate-400">Gastos Mensuales</span>
                        <div class="p-2 bg-rose-500/10 text-rose-500 rounded-lg">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M17 13l-5 5m0 0l-5-5m5 5V6" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="text-3xl font-bold text-white" id="gastosMes">$0.00</div>
                    <div class="mt-2 text-sm text-rose-500 font-medium flex items-center">
                        <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 14l-7 7m0 0l-7-7m7 7V3" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"></path>
                        </svg>
                        <span id="gastosMesSub">Mes actual</span>
                    </div>
                </div>
            </section>
            <!-- END: Key Metric Cards -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- BEGIN: Income vs Expenses Chart -->
                <section class="lg:col-span-2 bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800"
                    data-purpose="chart-container">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-bold text-white">Ingresos vs Gastos</h3>
                        <select id="rangoGrafico" class="text-xs border-slate-700 rounded-md py-1 bg-slate-800 text-slate-300">
                            <option value="6m">Últimos 6 Meses</option>
                            <option value="1y">Último Año</option>
                        </select>
                    </div>
                    <div class="h-64 flex items-end justify-between space-x-2 px-2" id="bar-chart">
                        <!-- Simplified Bar Chart Representation -->
                        <div class="flex flex-col items-center flex-1 space-y-2">
                            <div class="w-full flex justify-center space-x-1">
                                <div class="w-4 bg-emerald-500 rounded-t-sm" style="height: 120px;"></div>
                                <div class="w-4 bg-slate-700 rounded-t-sm" style="height: 80px;"></div>
                            </div>
                            <span class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Ene</span>
                        </div>
                        <div class="flex flex-col items-center flex-1 space-y-2">
                            <div class="w-full flex justify-center space-x-1">
                                <div class="w-4 bg-emerald-500 rounded-t-sm" style="height: 140px;"></div>
                                <div class="w-4 bg-slate-700 rounded-t-sm" style="height: 90px;"></div>
                            </div>
                            <span class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Feb</span>
                        </div>
                        <div class="flex flex-col items-center flex-1 space-y-2">
                            <div class="w-full flex justify-center space-x-1">
                                <div class="w-4 bg-emerald-500 rounded-t-sm" style="height: 110px;"></div>
                                <div class="w-4 bg-slate-700 rounded-t-sm" style="height: 100px;"></div>
                            </div>
                            <span class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Mar</span>
                        </div>
                        <div class="flex flex-col items-center flex-1 space-y-2">
                            <div class="w-full flex justify-center space-x-1">
                                <div class="w-4 bg-emerald-500 rounded-t-sm" style="height: 160px;"></div>
                                <div class="w-4 bg-slate-700 rounded-t-sm" style="height: 110px;"></div>
                            </div>
                            <span class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Abr</span>
                        </div>
                        <div class="flex flex-col items-center flex-1 space-y-2">
                            <div class="w-full flex justify-center space-x-1">
                                <div class="w-4 bg-emerald-500 rounded-t-sm" style="height: 150px;"></div>
                                <div class="w-4 bg-slate-700 rounded-t-sm" style="height: 95px;"></div>
                            </div>
                            <span class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">May</span>
                        </div>
                        <div class="flex flex-col items-center flex-1 space-y-2">
                            <div class="w-full flex justify-center space-x-1">
                                <div class="w-4 bg-emerald-500 rounded-t-sm" style="height: 180px;"></div>
                                <div class="w-4 bg-slate-700 rounded-t-sm" style="height: 120px;"></div>
                            </div>
                            <span class="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Jun</span>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-center space-x-6 text-sm">
                        <div class="flex items-center">
                            <span class="w-3 h-3 bg-emerald-500 rounded-full mr-2"></span>
                            <span class="text-slate-400">Ingresos</span>
                        </div>
                        <div class="flex items-center">
                            <span class="w-3 h-3 bg-slate-700 rounded-full mr-2"></span>
                            <span class="text-slate-400">Gastos</span>
                        </div>
                    </div>
                </section>
                <!-- END: Income vs Expenses Chart -->
                <!-- BEGIN: Recent Transactions -->
                <section class="bg-slate-900 rounded-2xl shadow-sm border border-slate-800 flex flex-col"
                    data-purpose="transactions-list">
                    <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                        <h3 class="font-bold text-white">Transacciones Recientes</h3>
                        <a class="text-sm text-emerald-500 hover:underline font-medium" href="#">Ver Todas</a>
                    </div>
                    <div class="flex-1 overflow-y-auto px-2" id="listaTransacciones">
                    </div>
                </section>
                <!-- END: Recent Transactions -->
            </div>
            <!-- BEGIN: Expenses by Category -->
            <section class="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800"
                data-purpose="expenses-by-category">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="font-bold text-white">Gastos por Categoría</h3>
                    <span class="text-xs text-slate-500 font-medium">Este mes</span>
                </div>
                <div class="space-y-4" id="categoriasGasto">
                </div>
            </section>
            <!-- END: Expenses by Category -->
        </div>
    </main>
    <!-- END: Main Content -->
    <script src="../js/funciones.js"></script>
    <script src="../js/notificaciones.js"></script>
    <script src="../js/panelControl.js"></script>
    <script src="../js/loadmenu.js"></script>
</body>

</html>
