<!DOCTYPE html>

<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Nueva Transacción - Gestor de Finanzas</title>
  <!-- Tailwind CSS CDN with Plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#10b77f',
              50: '#f0fdf7',
              100: '#dcfceb',
              200: '#bbf7d7',
              300: '#86efb8',
              400: '#4ade99',
              500: '#10b77f',
              600: '#059666',
              700: '#047855',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c21',
            },
          },
          borderRadius: {
            'none': '0',
            'sm': '0.125rem',
            DEFAULT: '8px',
            'md': '0.375rem',
            'lg': '0.5rem',
            'xl': '0.75rem',
            '2xl': '1rem',
            '3xl': '1.5rem',
            'full': '9999px',
          }
        }
      }
    }
  </script>
  <!-- Font Awesome for Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <style data-purpose="custom-transitions">
    body {
      font-family: 'Inter', sans-serif;
    }

    .transition-all {
      transition: all 0.3s ease;
    }

    .income-active {
      color: #10b77f;
      border-bottom: 2px solid #10b77f;
    }

    .expense-active {
      color: #ef4444;
      border-bottom: 2px solid #ef4444;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex overflow-hidden">
  <!-- BEGIN: Sidebar Navigation -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex border-r border-slate-800"  data-component="../components/sidemenu.html"  data-purpose="sidebar"> </aside>
  <!-- END: Sidebar Navigation -->
  <!-- Main content area -->
  <div class="flex-1 flex flex-col h-screen overflow-y-auto p-4 md:p-8 space-y-6">
    <!-- BEGIN: MainContainer -->
    <main class="w-full max-w-4xl bg-slate-900 rounded-lg shadow-2xl overflow-hidden border border-slate-800 mx-auto"
      data-purpose="transaction-form-container">
      <!-- BEGIN: HeaderTabs -->
      <header class="flex border-b border-slate-800" data-purpose="transaction-type-switcher">
        <button class="flex-1 py-4 text-center font-semibold text-lg expense-active transition-all" id="expenseTab"
          onclick="switchType('expense')">
          <i class="fa-solid fa-arrow-up-from-bracket mr-2"></i>Gasto
        </button>
        <button
          class="flex-1 py-4 text-center font-semibold text-lg text-slate-500 hover:bg-slate-800/50 transition-all"
          id="incomeTab" onclick="switchType('income')">
          <i class="fa-solid fa-arrow-down-to-bracket mr-2"></i>Ingreso
        </button>
      </header>
      <!-- END: HeaderTabs -->
      <div class="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- BEGIN: InputForm -->
        <section data-purpose="input-section">
          <form class="space-y-5" id="transactionForm">
            <!-- Amount Input -->
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1" for="amount">Monto</label>
              <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-bold">$</span>
                <input
                  class="w-full pl-8 pr-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all"
                  id="amount" oninput="updatePreview()" placeholder="0.00" step="0.01" type="number" />
              </div>
            </div>
            <!-- Date Input -->
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1" for="date">Fecha</label>
              <input
                class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all [color-scheme:dark]"
                id="date" oninput="updatePreview()" type="date" />
            </div>
            <!-- Account Selection -->
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1" for="account">Cuenta</label>
              <select
                class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all"
                id="account">
                <option value="">Seleccionar cuenta</option>
              </select>
            </div>
            <!-- Category Selection -->
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1" for="category">Categoría</label>
              <select
                class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all"
                id="category">
                <option value="">Seleccionar tipo</option>
              </select>
            </div>
            <!-- Subtipo Selection -->
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1" for="subtipo">Subtipo</label>
              <select
                class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all"
                id="subtipo">
                <option value="">Seleccionar subtipo</option>
              </select>
            </div>
            <!-- Note Field -->
            <div>
              <label class="block text-sm font-medium text-slate-400 mb-1" for="note">Nota / Descripción</label>
              <textarea
                class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all"
                id="note" oninput="updatePreview()" placeholder="Añadir una descripción..." rows="3"></textarea>
            </div>
            <button
              class="w-full py-3 bg-brand text-white font-bold rounded-lg hover:bg-brand-600 transition-colors shadow-lg shadow-brand/20"
              type="button" id="btnGuardarTransaccion">
              Guardar Transacción
            </button>
          </form>
        </section>
        <!-- END: InputForm -->
        <!-- BEGIN: LivePreview -->
        <section class="flex flex-col" data-purpose="preview-section">
          <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Vista Previa</h3>
          <div
            class="flex-1 bg-slate-950/50 border-2 border-dashed border-slate-800 rounded-lg p-6 flex flex-col justify-center items-center text-center space-y-4"
            id="previewCard">
            <!-- This icon changes based on category -->
            <div
              class="w-16 h-16 bg-slate-900 rounded-full flex items-center justify-center text-2xl shadow-inner border border-slate-800 text-slate-400"
              id="previewIcon">
              <i class="fa-solid fa-receipt"></i>
            </div>
            <div>
              <p class="text-3xl font-bold text-red-500" id="previewAmount">-$0.00</p>
              <p class="text-slate-300 font-medium" id="previewCategory">Seleccionar Categoría</p>
            </div>
            <div class="w-full pt-4 border-t border-slate-800 text-sm text-slate-500 space-y-1">
              <div class="flex justify-between">
                <span>Cuenta:</span>
                <span class="font-semibold text-slate-300" id="previewAccount">Seleccionar cuenta</span>
              </div>
              <div class="flex justify-between">
                <span>Fecha:</span>
                <span class="font-semibold text-slate-300" id="previewDate">--/--/----</span>
              </div>
            </div>
            <p class="text-xs italic text-slate-600 line-clamp-2" id="previewNote">No hay descripción...</p>
          </div>
        </section>
        <!-- END: LivePreview -->
      </div>
    </main>
    <!-- END: MainContainer -->

    <!-- BEGIN: Movimientos Table -->
    <main class="w-full max-w-4xl bg-slate-900 rounded-lg shadow-2xl overflow-hidden border border-slate-800 mx-auto"
      data-purpose="movements-table">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
        <h3 class="font-bold text-white">Movimientos</h3>
        <div class="flex items-center gap-3">
          <span class="text-sm text-slate-500" id="totalMovimientos"></span>
          <button type="button" id="btnExportarCSV"
            class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-sm font-semibold hover:bg-slate-700 transition-colors">
            Exportar CSV
          </button>
          <label for="inputImportarCSV"
            class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-sm font-semibold hover:bg-slate-700 transition-colors cursor-pointer">
            Importar CSV
          </label>
          <input type="file" id="inputImportarCSV" accept=".csv" class="hidden" />
        </div>
      </div>
      <div class="flex flex-wrap items-end gap-3 px-6 py-3 border-b border-slate-800">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1" for="filtroCuenta">Cuenta</label>
          <select id="filtroCuenta"
            class="px-3 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all">
            <option value="">Todas</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1" for="filtroDesde">Desde</label>
          <input type="date" id="filtroDesde"
            class="px-3 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all [color-scheme:dark]" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1" for="filtroHasta">Hasta</label>
          <input type="date" id="filtroHasta"
            class="px-3 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all [color-scheme:dark]" />
        </div>
        <button type="button" id="btnLimpiarFiltros"
          class="px-3 py-2 rounded-lg bg-slate-800 text-slate-300 text-sm font-semibold hover:bg-slate-700 transition-colors">
          Limpiar
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="text-xs uppercase tracking-wider text-slate-500 border-b border-slate-800">
            <tr>
              <th class="px-4 py-3">Fecha</th>
              <th class="px-4 py-3">Tipo</th>
              <th class="px-4 py-3">Cuenta</th>
              <th class="px-4 py-3 text-right">Monto</th>
              <th class="px-4 py-3 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyMovimientos" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </main>
    <!-- END: Movimientos Table -->
  </div>

  <!-- BEGIN: Modal Editar -->
  <div id="modalEditar" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
    <div class="bg-slate-900 rounded-xl border border-slate-800 shadow-xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-bold text-white">Editar Movimiento</h2>
        <button type="button" data-cerrar-edicion class="text-slate-500 hover:text-slate-300 transition-colors text-xl">
          &times;
        </button>
      </div>
      <div class="flex border-b border-slate-800 mb-5">
        <button type="button" class="flex-1 py-3 text-center font-semibold expense-active transition-all"
          id="editExpenseTab" onclick="setTipoEditar('expense')">
          <i class="fa-solid fa-arrow-up-from-bracket mr-2"></i>Gasto
        </button>
        <button type="button"
          class="flex-1 py-3 text-center font-semibold text-slate-500 hover:bg-slate-800/50 transition-all"
          id="editIncomeTab" onclick="setTipoEditar('income')">
          <i class="fa-solid fa-arrow-down-to-bracket mr-2"></i>Ingreso
        </button>
      </div>
      <form id="formEditar" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="editAmount">Monto</label>
          <input id="editAmount" type="number" step="0.01"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="editDate">Fecha</label>
          <input id="editDate" type="date"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all [color-scheme:dark]" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="editAccount">Cuenta</label>
          <select id="editAccount"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all">
            <option value="">Seleccionar cuenta</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="editCategory">Categoría</label>
          <select id="editCategory"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all">
            <option value="">Seleccionar tipo</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="editSubtipo">Subtipo</label>
          <select id="editSubtipo"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all">
            <option value="">Seleccionar subtipo</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1" for="editNote">Nota / Descripción</label>
          <textarea id="editNote" rows="2"
            class="w-full px-4 py-2 rounded-lg bg-slate-950 border-slate-800 text-slate-200 focus:ring-2 focus:ring-brand focus:border-brand transition-all"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" data-cerrar-edicion
            class="flex-1 py-2.5 rounded-lg bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 transition-colors">
            Cancelar
          </button>
          <button type="button" id="btnGuardarEdicion"
            class="flex-1 py-2.5 rounded-lg bg-brand text-white font-bold hover:bg-brand-600 transition-colors">
            Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
  <!-- END: Modal Editar -->

  <!-- BEGIN: Modal Confirmar Eliminar -->
  <div id="modalEliminar" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
    <div class="bg-slate-900 rounded-xl border border-slate-800 shadow-xl w-full max-w-sm p-6 text-center">
      <div
        class="w-14 h-14 mx-auto bg-rose-600/20 rounded-full flex items-center justify-center text-rose-400 mb-4">
        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-2">¿Eliminar movimiento?</h2>
      <p class="text-sm text-slate-400 mb-6">Esta acción no se puede deshacer.</p>
      <div class="flex gap-3">
        <button type="button" data-cerrar-eliminar
          class="flex-1 py-2.5 rounded-lg bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 transition-colors">
          Cancelar
        </button>
        <button type="button" id="btnConfirmarEliminar"
          class="flex-1 py-2.5 rounded-lg bg-rose-600 text-white font-bold hover:bg-rose-500 transition-colors">
          Eliminar
        </button>
      </div>
    </div>
  </div>
  <!-- END: Modal Confirmar Eliminar -->

  <script src="../js/funciones.js"></script>
  <script src="../js/notificaciones.js"></script>
  <script src="../js/transacciones.js"></script>
  <script src="../js/loadmenu.js"></script>
</body>

</html>
