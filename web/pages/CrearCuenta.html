<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;900&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10b981", // Emerald Green accent
                        "background-light": "#0a192f", // Navy Blue background
                        "background-dark": "#020617",
                        "navy-muted": "#112240",
                        "navy-light": "#233554"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        @view-transition {
            navigation: auto;
        }

        body {
            animation: page-fade-in .18s ease-out;
        }

        @keyframes page-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
    <title>Registro - CashFlow</title>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-100 min-h-screen flex flex-col">
    <!-- Main Container -->
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <!-- Header / Nav -->
        <!-- Registration Form Section -->
        <main class="flex-1 flex items-center justify-center p-6">
            <div class="w-full max-w-[440px] flex flex-col gap-8">
                <!-- Welcome Text -->
                <div class="flex flex-col gap-2">
                    <h1 class="text-4xl font-black tracking-tight text-white">Crear Cuenta</h1>
                    <p class="text-slate-400 text-base leading-relaxed">
                        Únete a CashFlow y gestiona tus finanzas de forma profesional.
                    </p>
                </div>
                <!-- Form Fields -->
                <form class="flex flex-col gap-5" id="formCrearCuenta">
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-200 text-sm font-semibold ml-1">Nombre</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                            <input 
                                id="inputNombre"
                                class="w-full h-14 pl-12 pr-4 rounded-xl border border-navy-light bg-navy-muted text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all"
                                placeholder="Ingresa tu nombre" type="text" />
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-200 text-sm font-semibold ml-1">Apellido</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                            <input 
                                id="inputApellido"
                                class="w-full h-14 pl-12 pr-4 rounded-xl border border-navy-light bg-navy-muted text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all"
                                placeholder="Ingresa tu apellido" type="text" />
                        </div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-slate-200 text-sm font-semibold ml-1">Contraseña</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                            <input 
                                id="inputPassword"
                                class="w-full h-14 pl-12 pr-12 rounded-xl border border-navy-light bg-navy-muted text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all"
                                placeholder="Crea una contraseña" type="password" />
                            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                                type="button" id="btnTogglePassword">
                                <span class="material-symbols-outlined text-xl">visibility</span>
                            </button>
                        </div>
                    </div>
                    <!-- Submit Button -->
                    <button 
                        id="btnCrearCuenta"
                        type="button"
                        class="mt-4 w-full h-14 bg-primary hover:bg-emerald-500 text-background-light font-bold text-lg rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
                        Crear Cuenta
                        <span
                            class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>
                </form>
                <!-- Footer Links -->
                <div class="flex flex-col items-center gap-4 text-sm">
                    <p class="text-slate-400">
                        ¿Ya tienes una cuenta?
                        <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="./login.html">Inicia
                            sesión</a>
                    </p>
                    <div class="flex items-center gap-4 w-full py-4">
                        <div class="h-[1px] flex-1 bg-navy-light/50"></div>
                        <span class="text-slate-500 text-xs font-bold uppercase tracking-widest">o regístrate con</span>
                        <div class="h-[1px] flex-1 bg-navy-light/50"></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 w-full">
                        <button
                            class="flex items-center justify-center gap-2 h-12 rounded-xl bg-navy-muted border border-navy-light hover:bg-navy-light transition-colors text-white text-sm font-medium">
                            <svg class="w-5 h-5" viewbox="0 0 24 24">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="currentColor"></path>
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="currentColor"></path>
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                                    fill="currentColor"></path>
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="currentColor"></path>
                            </svg>
                            Google
                        </button>
                        <button
                            class="flex items-center justify-center gap-2 h-12 rounded-xl bg-navy-muted border border-navy-light hover:bg-navy-light transition-colors text-white text-sm font-medium">
                            <span class="material-symbols-outlined text-xl">ios</span>
                            Apple
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <!-- Terms Footer -->
        <footer class="p-8 text-center">
            <p class="text-slate-500 text-xs">
                Al crear una cuenta, aceptas nuestros <a class="underline hover:text-slate-300" href="#">Términos de
                    Servicio</a> y <a class="underline hover:text-slate-300" href="#">Política de Privacidad</a>.
            </p>
        </footer>
        <!-- Background Decorative Elements -->
        <div class="fixed top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full -z-10"></div>
        <div class="fixed bottom-[-10%] left-[-5%] w-[30%] h-[30%] bg-primary/5 blur-[100px] rounded-full -z-10"></div>
    </div>
</body>

</html>
<script src="../js/funciones.js"></script>
<script src="../js/validacion.js"></script>
<script src="../js/notificaciones.js"></script>
<script src="../js/CrearCuenta.js"></script>
